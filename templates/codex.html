<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITAN CODEX - Soul Box Storage</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 2px solid #00d9ff;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 3em;
            background: linear-gradient(90deg, #00d9ff, #00ff9f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #888;
            font-size: 1.1em;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            padding: 20px;
            background: rgba(0, 217, 255, 0.1);
            border-radius: 10px;
            margin-bottom: 30px;
            border: 1px solid #00d9ff;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            color: #00d9ff;
            font-weight: bold;
        }

        .stat-label {
            color: #888;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .panel {
            background: rgba(26, 26, 46, 0.8);
            border: 1px solid #333;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .panel-title {
            font-size: 1.5em;
            color: #00d9ff;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #00ff9f;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #444;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 1em;
            font-family: inherit;
        }

        textarea {
            min-height: 200px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #00d9ff;
            box-shadow: 0 0 10px rgba(0, 217, 255, 0.3);
        }

        .tag-input-container {
            display: flex;
            gap: 10px;
        }

        .tag-input-container input {
            flex: 1;
        }

        .tags-display {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .tag {
            background: linear-gradient(135deg, #00d9ff, #00ff9f);
            color: #000;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .tag:hover {
            transform: scale(1.05);
        }

        button {
            background: linear-gradient(135deg, #00d9ff, #00ff9f);
            color: #000;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 217, 255, 0.5);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #444, #666);
            color: #fff;
        }

        .results-container {
            grid-column: 1 / -1;
        }

        .soul-box-item {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
            border-left: 4px solid #00d9ff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .soul-box-item:hover {
            border-left-color: #00ff9f;
            box-shadow: 0 5px 15px rgba(0, 217, 255, 0.3);
            transform: translateX(5px);
        }

        .box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .box-title {
            font-size: 1.2em;
            color: #00d9ff;
            font-weight: bold;
        }

        .box-meta {
            color: #888;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .box-content {
            color: #ccc;
            line-height: 1.6;
            margin-top: 15px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            max-height: 200px;
            overflow-y: auto;
        }

        .box-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .box-actions button {
            padding: 8px 16px;
            font-size: 0.9em;
        }

        .status-message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .status-success {
            background: rgba(0, 255, 159, 0.2);
            border: 1px solid #00ff9f;
            color: #00ff9f;
        }

        .status-error {
            background: rgba(255, 59, 59, 0.2);
            border: 1px solid #ff3b3b;
            color: #ff3b3b;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #00d9ff;
            font-size: 1.2em;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ TITAN CODEX ⚡</h1>
            <p class="subtitle">Soul Box Storage & Retrieval System</p>
        </header>

        <div class="stats-bar">
            <div class="stat">
                <div class="stat-value" id="totalBoxes">0</div>
                <div class="stat-label">Soul Boxes</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="totalWords">0</div>
                <div class="stat-label">Total Words</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="totalTags">0</div>
                <div class="stat-label">Unique Tags</div>
            </div>
        </div>

        <div class="main-grid">
            <!-- Store Panel -->
            <div class="panel">
                <div class="panel-title">📦 Store Soul Box</div>
                
                <div id="storeStatus" class="status-message"></div>

                <div class="input-group">
                    <label>Title</label>
                    <input type="text" id="storeTitle" placeholder="e.g., Finance Tracker Project - Feb 5">
                </div>

                <div class="input-group">
                    <label>Content</label>
                    <textarea id="storeContent" placeholder="Paste your soul box content here..."></textarea>
                </div>

                <div class="input-group">
                    <label>Tags (comma separated)</label>
                    <div class="tag-input-container">
                        <input type="text" id="storeTags" placeholder="e.g., finance, spreadsheet, automation">
                    </div>
                    <div class="tags-display" id="tagsDisplay"></div>
                </div>

                <button onclick="storeSoulBox()">💾 Store Soul Box</button>
            </div>

            <!-- Search Panel -->
            <div class="panel">
                <div class="panel-title">🔍 Retrieve Soul Box</div>
                
                <div id="searchStatus" class="status-message"></div>

                <div class="input-group">
                    <label>Search Query</label>
                    <input type="text" id="searchQuery" placeholder="e.g., finance tracker spreadsheet">
                </div>

                <div class="input-group">
                    <label>Filter by Tag (optional)</label>
                    <input type="text" id="searchTagFilter" placeholder="e.g., finance">
                </div>

                <div style="display: flex; gap: 10px;">
                    <button onclick="searchSoulBoxes()">🔎 Search</button>
                    <button class="btn-secondary" onclick="listAllBoxes()">📋 List All</button>
                    <button class="btn-secondary" onclick="refreshStats()">🔄 Refresh</button>
                </div>
            </div>

            <!-- Results Panel -->
            <div class="panel results-container">
                <div class="panel-title">📚 Results</div>
                <div id="resultsContainer">
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>No soul boxes yet. Store your first one above!</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // API base URL
        const API_URL = 'http://localhost:5000/api';

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            refreshStats();
            listAllBoxes();
        });

        // Show status message
        function showStatus(elementId, message, isError = false) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.className = 'status-message ' + (isError ? 'status-error' : 'status-success');
            element.style.display = 'block';
            setTimeout(() => {
                element.style.display = 'none';
            }, 5000);
        }

        // Refresh statistics
        async function refreshStats() {
            try {
                const response = await fetch(`${API_URL}/stats`);
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('totalBoxes').textContent = data.stats.total_boxes;
                    document.getElementById('totalWords').textContent = data.stats.total_words.toLocaleString();
                    document.getElementById('totalTags').textContent = data.stats.unique_tags;
                }
            } catch (error) {
                console.error('Stats error:', error);
            }
        }

        // Store soul box
        async function storeSoulBox() {
            const title = document.getElementById('storeTitle').value.trim();
            const content = document.getElementById('storeContent').value.trim();
            const tagsStr = document.getElementById('storeTags').value.trim();

            if (!content) {
                showStatus('storeStatus', '❌ Please enter content', true);
                return;
            }

            const tags = tagsStr ? tagsStr.split(',').map(t => t.trim()) : [];

            try {
                const response = await fetch(`${API_URL}/store`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        title: title || 'Untitled Soul Box',
                        content: content,
                        tags: tags
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showStatus('storeStatus', `✅ Soul box stored! ID: ${data.id}`);
                    document.getElementById('storeTitle').value = '';
                    document.getElementById('storeContent').value = '';
                    document.getElementById('storeTags').value = '';
                    refreshStats();
                    listAllBoxes();
                } else {
                    showStatus('storeStatus', `❌ Error: ${data.error}`, true);
                }
            } catch (error) {
                showStatus('storeStatus', `❌ Network error: ${error.message}`, true);
            }
        }

        // Search soul boxes
        async function searchSoulBoxes() {
            const query = document.getElementById('searchQuery').value.trim();
            const tagFilter = document.getElementById('searchTagFilter').value.trim();

            if (!query) {
                showStatus('searchStatus', '❌ Please enter a search query', true);
                return;
            }

            const resultsContainer = document.getElementById('resultsContainer');
            resultsContainer.innerHTML = '<div class="loading">🔍 Searching...</div>';

            try {
                const response = await fetch(`${API_URL}/search`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        query: query,
                        n_results: 10,
                        tag_filter: tagFilter || null
                    })
                });

                const data = await response.json();

                if (data.success) {
                    displayResults(data.results);
                    showStatus('searchStatus', `✅ Found ${data.results.length} results`);
                } else {
                    resultsContainer.innerHTML = `<div class="empty-state">❌ Error: ${data.error}</div>`;
                    showStatus('searchStatus', `❌ Error: ${data.error}`, true);
                }
            } catch (error) {
                resultsContainer.innerHTML = `<div class="empty-state">❌ Network error: ${error.message}</div>`;
                showStatus('searchStatus', `❌ Network error: ${error.message}`, true);
            }
        }

        // List all boxes
        async function listAllBoxes() {
            const resultsContainer = document.getElementById('resultsContainer');
            resultsContainer.innerHTML = '<div class="loading">📦 Loading soul boxes...</div>';

            try {
                const response = await fetch(`${API_URL}/list`);
                const data = await response.json();

                if (data.success) {
                    if (data.boxes.length === 0) {
                        resultsContainer.innerHTML = `
                            <div class="empty-state">
                                <div class="empty-state-icon">📭</div>
                                <p>No soul boxes yet. Store your first one above!</p>
                            </div>
                        `;
                    } else {
                        displayBoxList(data.boxes);
                    }
                } else {
                    resultsContainer.innerHTML = `<div class="empty-state">❌ Error: ${data.error}</div>`;
                }
            } catch (error) {
                resultsContainer.innerHTML = `<div class="empty-state">❌ Network error: ${error.message}</div>`;
            }
        }

        // Display search results
        function displayResults(results) {
            const resultsContainer = document.getElementById('resultsContainer');
            
            if (results.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <p>No matching soul boxes found.</p>
                    </div>
                `;
                return;
            }

            let html = '';
            results.forEach(result => {
                const similarity = result.similarity ? `${(result.similarity * 100).toFixed(1)}% match` : '';
                html += `
                    <div class="soul-box-item">
                        <div class="box-header">
                            <div class="box-title">${result.metadata.title}</div>
                            <div class="box-meta">${similarity}</div>
                        </div>
                        <div class="box-meta">
                            📅 ${new Date(result.metadata.timestamp).toLocaleString()} | 
                            📝 ${result.metadata.word_count} words | 
                            🏷️ ${result.metadata.tags}
                        </div>
                        <div class="box-content">${escapeHtml(result.content)}</div>
                        <div class="box-actions">
                            <button onclick="copySoulBox('${result.id}')">📋 Copy</button>
                            <button class="btn-secondary" onclick="deleteSoulBox('${result.id}')">🗑️ Delete</button>
                        </div>
                    </div>
                `;
            });
            resultsContainer.innerHTML = html;
        }

        // Display box list
        function displayBoxList(boxes) {
            const resultsContainer = document.getElementById('resultsContainer');
            
            let html = '';
            boxes.forEach(box => {
                html += `
                    <div class="soul-box-item">
                        <div class="box-header">
                            <div class="box-title">${box.title}</div>
                        </div>
                        <div class="box-meta">
                            📅 ${new Date(box.timestamp).toLocaleString()} | 
                            📝 ${box.word_count} words | 
                            🏷️ ${box.tags}
                        </div>
                        <div class="box-actions">
                            <button onclick="viewFullBox('${box.id}')">👁️ View</button>
                            <button onclick="copySoulBoxById('${box.id}')">📋 Copy</button>
                            <button class="btn-secondary" onclick="deleteSoulBox('${box.id}')">🗑️ Delete</button>
                        </div>
                    </div>
                `;
            });
            resultsContainer.innerHTML = html;
        }

       // Copy soul box content
    async function copySoulBox(boxId) {
        try {
            const response = await fetch(`${API_URL}/get/${boxId}`);
            const data = await response.json();
            if (data.success) {
                await navigator.clipboard.writeText(data.result.content);
                alert('✅ Soul box copied to clipboard!');
            } else {
                alert('❌ Error: ' + data.error);
            }
        } catch (error) {
            alert('❌ Failed to copy: ' + error.message);
        }
    }

        // View full box (for list view)
       async function viewFullBox(boxId) {
        try {
            const response = await fetch(`${API_URL}/get/${boxId}`);
            const data = await response.json();

            if (data.success) {
                displayResults([data.result]);
            } else {
                alert('❌ Error: ' + data.error);
            }
        } catch (error) {
            alert('❌ Network error: ' + error.message);
        }
    }

        // Copy by ID
        async function copySoulBoxById(boxId) {
            await copySoulBox(boxId);
        }

        // Delete soul box
        async function deleteSoulBox(boxId) {
            if (!confirm('Are you sure you want to delete this soul box?')) return;

            try {
                const response = await fetch(`${API_URL}/delete`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({id: boxId})
                });

                const data = await response.json();

                if (data.success) {
                    alert('✅ Soul box deleted');
                    refreshStats();
                    listAllBoxes();
                } else {
                    alert('❌ Error: ' + data.error);
                }
            } catch (error) {
                alert('❌ Network error: ' + error.message);
            }
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Allow Enter key to search
        document.getElementById('searchQuery').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchSoulBoxes();
        });
    </script>
</body>
</html>
